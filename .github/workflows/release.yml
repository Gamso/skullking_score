name: Release

# Publie une release GitHub (APK + AAB) à chaque tag de version.
# Exemple : git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire, sans publication (ex. 1.0.0)"
        required: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build et publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Déterminer la version
        id: version
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${RAW#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Préparer le keystore de signature
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 absent : les artefacts ne seront pas signés."
          fi

      - name: Vérifications
        run: sh ./gradlew ktlintCheck detekt :core-scoring:test :app:testDebugUnitTest :app:lintDebug

      - name: Construire l'APK et l'AAB de release
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          sh ./gradlew :app:assembleRelease :app:bundleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Nommer les artefacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist
          SUFFIX=""
          if [ "$SIGNED" != "true" ]; then SUFFIX="-unsigned"; fi
          cp app/build/outputs/apk/release/*.apk "dist/skullking-score-${VERSION}${SUFFIX}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/skullking-score-${VERSION}.aab"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: skullking-score-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Publier la release GitHub
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
