name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  ktlint:
    name: Ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew ktlintCheck
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ktlint-reports
          path: "**/build/reports/ktlint/**"

  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew detekt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: detekt-reports
          path: "**/build/reports/detekt/**"

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew :app:lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew :core-scoring:test :app:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  build-apk:
    name: APK debug
    runs-on: ubuntu-latest
    needs: [ktlint, detekt, android-lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: skullking-score-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumented-tests:
    name: Tests instrumentés (émulateur)
    runs-on: ubuntu-latest
    # Désactivable : définir la variable de dépôt SKIP_INSTRUMENTED_TESTS à « true ».
    if: vars.SKIP_INSTRUMENTED_TESTS != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: app/build/reports/androidTests/**
