# Codecov: the unit and instrumented reports are merged into one global coverage.
coverage:
  status:
    # Informational only: a coverage drop is shown on the pull request but never blocks it.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "diff, flags, files"
  require_changes: false

flags:
  unit:
    carryforward: true
  instrumented:
    carryforward: true
